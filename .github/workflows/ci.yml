name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/synac_test?schema=public
      SYNAC_STAGING_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/synac_staging_test?schema=public
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v4
        with:
          version: 10.27.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install and start PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql
          sudo service postgresql start
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres';"
          sudo -u postgres psql -tc "SELECT 1 FROM pg_database WHERE datname = 'synac_test'" | tr -d '[:space:]' | grep -q 1 || sudo -u postgres createdb synac_test
          sudo -u postgres psql -tc "SELECT 1 FROM pg_database WHERE datname = 'synac_staging_test'" | tr -d '[:space:]' | grep -q 1 || sudo -u postgres createdb synac_staging_test

      - name: Apply migrations
        run: |
          pnpm --filter @synac/db db:migrate:deploy
          DATABASE_URL="$SYNAC_STAGING_DATABASE_URL" pnpm --filter @synac/db db:migrate:deploy

      # Equivalent to `pnpm gate`; split for clearer logs.
      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
