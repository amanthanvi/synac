name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v4
        with:
          version: 10.34.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Deploys schema + functions to a throwaway local backend, which also
      # regenerates convex/_generated and typechecks the functions.
      - name: Validate Convex functions
        run: CONVEX_AGENT_MODE=anonymous npx convex dev --once

      # Equivalent to `pnpm gate`; split for clearer logs.
      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Content check
        run: pnpm content:check && pnpm content:history
        env:
          SYNAC_ASSIGNMENTS_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}

      - name: Build
        run: pnpm build
