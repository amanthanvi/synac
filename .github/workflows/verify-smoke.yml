# Optional smoke for the verification skill.
# This workflow is not part of the required CI or Quality checks.
# Branch protection should not list it.

name: Verify smoke

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-smoke:
    name: Doctor and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.4

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux

      - name: Install Playwright chromium
        run: pnpm --filter @synac/e2e exec playwright install --with-deps chromium

      - name: Launch
        run: pnpm verify:launch
        env:
          VERIFY_SKIP_BROWSER_INSTALL: "1"

      - name: Doctor
        run: pnpm verify:doctor

      - name: Smoke
        run: pnpm verify:smoke

      - name: Cleanup
        if: always()
        run: pnpm verify:cleanup

      - name: Resolve evidence dir
        if: always()
        run: node --input-type=module -e 'import { evidenceDir } from "./.agents/skills/verify-synac/scripts/runtime.mjs"; import { appendFileSync } from "node:fs"; appendFileSync(process.env.GITHUB_ENV, `VERIFY_EVIDENCE_DIR=${evidenceDir}\n`);'

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: verify-smoke-evidence
          path: ${{ env.VERIFY_EVIDENCE_DIR }}
          if-no-files-found: ignore
          retention-days: 7
