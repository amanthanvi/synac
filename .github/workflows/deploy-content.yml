name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      assignments_base_ref:
        description: Previous deployed Git SHA for assignment-history validation
        required: true
        type: string

concurrency:
  group: deploy-content
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v4
        with:
          version: 10.34.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Validate repository
        run: pnpm gate
        env:
          SYNAC_ASSIGNMENTS_BASE_REF: ${{ github.event_name == 'push' && github.event.before || inputs.assignments_base_ref }}

      - name: Deploy Convex functions
        run: npx convex deploy
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

      - name: Sync content into Convex
        run: pnpm --filter @synac/content-tools sync -- --prod
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
