name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      SYNAC_RATE_LIMIT_SALT: ci-placeholder-salt
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.4

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Deploys schema + functions to a throwaway local backend, which also
      # regenerates convex/_generated and typechecks the functions.
      - name: Validate Convex functions
        run: CONVEX_AGENT_MODE=anonymous npx convex dev --once

      # Most of the steps below match `pnpm gate`, split for clearer logs.
      # `pnpm test:verify-tmux` stays outside the gate. See
      # docs/agents/gate-vs-ci.md.
      - name: Lint
        run: pnpm lint

      - name: Lint (convex)
        run: pnpm lint:convex

      - name: Format
        run: pnpm format

      - name: Typecheck
        run: pnpm typecheck

      - name: Typecheck (convex)
        run: pnpm typecheck:convex

      - name: Test
        run: pnpm test

      # Not part of `pnpm gate`. The session test needs tmux, which the
      # default test script does not install or invoke.
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux

      - name: Verify session isolation
        run: pnpm test:verify-tmux

      - name: Tagging check
        run: pnpm tagging:check

      - name: Content check
        run: pnpm content:check && pnpm content:history
        env:
          SYNAC_ASSIGNMENTS_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}

      - name: Build
        run: pnpm build

      # Also the last step of `pnpm gate`. Kept as its own step so the log
      # names the warning check.
      - name: Lint (no warnings)
        run: pnpm lint:strict
