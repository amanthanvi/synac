name: Ingest

on:
  schedule:
    # Weekly, Monday 06:20 UTC.
    - cron: '20 6 * * 1'
  workflow_dispatch:
    inputs:
      source:
        description: 'Source slug to ingest (empty = all enabled sources)'
        required: false
        default: ''

# The regenerate job only reads. Write access lives on the pull request job.
permissions:
  contents: read

jobs:
  regenerate:
    name: Regenerate bundles
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.4

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The slug reaches the shell through the environment, never through
      # workflow expression interpolation inside the script body.
      - name: Regenerate bundles
        env:
          SOURCE: ${{ github.event.inputs.source }}
        run: |
          if [ -n "$SOURCE" ]; then
            pnpm --filter @synac/ingest-tools ingest -- --source "$SOURCE"
          else
            pnpm --filter @synac/ingest-tools ingest -- --all
          fi

      - name: Validate content
        run: pnpm content:check

      - name: Capture the content diff
        id: diff
        run: |
          # A first ingest of a new source creates an untracked bundle.
          git add --intent-to-add content/
          if git diff --quiet -- content/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git diff -- content/ > content.patch
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload the content diff
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: content-patch
          path: content.patch
          retention-days: 3
    outputs:
      changed: ${{ steps.diff.outputs.changed }}

  pull-request:
    name: Open pull request
    needs: regenerate
    if: needs.regenerate.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          fetch-depth: 0

      - name: Download the content diff
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: content-patch

      - name: Apply the content diff
        run: git apply content.patch && rm content.patch

      - name: Open pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.0.0
        with:
          branch: ingest/auto-update
          title: 'content: automated source ingest update'
          commit-message: 'content: automated source ingest update'
          labels: automated-ingest
          add-paths: content/
          body: |
            An automated ingest run regenerated one or more source bundles
            under `content/generated/`. Review the diff, then merge to publish.
            The deploy workflow syncs `main` into the Convex deployment.

            Bundles are machine-owned. To adjust how an entry is presented,
            edit `content/overrides/` instead of this diff.
          delete-branch: true
