<svg
  xmlns="http://www.w3.org/2000/svg"
  width="320"
  height="320"
  viewBox="0 0 320 320"
  preserveAspectRatio="none"
>
  <filter id="grain">
    <feTurbulence
      type="fractalNoise"
      baseFrequency="0.85"
      numOctaves="4"
      stitchTiles="stitch"
    />
    <feColorMatrix type="saturate" values="0" />
    <feComponentTransfer>
      <feFuncA type="table" tableValues="0 0.55" />
    </feComponentTransfer>
  </filter>

  <rect width="320" height="320" filter="url(#grain)" />
</svg>
