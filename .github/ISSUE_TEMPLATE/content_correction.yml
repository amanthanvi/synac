name: Content correction
description: Report an incorrect or unclear entry. Citations are required.
labels: ['content']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve SynAc.

        Every correction needs at least one citation. If this is a security
        issue, follow `SECURITY.md` instead of filing a public issue.
  - type: input
    id: url
    attributes:
      label: Entry URL
      placeholder: https://synac.app/term/... or https://synac.app/acronym/...
    validations:
      required: true
  - type: input
    id: sense
    attributes:
      label: Which sense?
      description: Paste the `#sense-...` fragment from the URL, or the sense label shown next to the meaning. Write "all" if the whole entry is wrong.
      placeholder: '#sense-rfc4949-5-i-internet'
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong?
      description: Name the sentence or section that is incorrect or unclear.
    validations:
      required: true
  - type: textarea
    id: fix
    attributes:
      label: Suggested correction
      description: What should it say instead?
    validations:
      required: false
  - type: dropdown
    id: wording_origin
    attributes:
      label: Is your wording quoted from the source or your own?
      description: SynAc records this so the entry carries the right license. Quoted wording stays under the source's license.
      options:
        - My own wording
        - Quoted verbatim from the source
        - Paraphrased from the source
        - Not applicable, I am only reporting a problem
    validations:
      required: true
  - type: input
    id: license_url
    attributes:
      label: License or terms URL of your source
      description: Link to the license or terms that govern reuse of the source you cite.
      placeholder: https://...
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Supporting citations
      description: Link authoritative sources such as standards, primary documentation, or peer-reviewed work. Quote the relevant lines.
      placeholder: |
        - https://example.com/...
        - https://example.com/...
    validations:
      required: true
