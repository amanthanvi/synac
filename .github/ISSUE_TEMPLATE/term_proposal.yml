name: Term proposal
description: Propose a new term or acronym for the glossary.
labels: ["content"]
body:
  - type: markdown
    attributes:
      value: |
        Glossary content lives in this repository under `content/`. Proposals
        become pull requests — either yours or a maintainer's — and every
        change is reviewed before it publishes.

        For terms covered by an authoritative source (NIST, RFC 4949, MITRE
        ATT&CK, …), the best path is a **Source request** so ingest can pick
        the whole source up. Use this template for individual terms with a
        supporting citation.
  - type: input
    id: term
    attributes:
      label: Term or acronym
      placeholder: zero trust, SBOM, ...
    validations:
      required: true
  - type: textarea
    id: definition
    attributes:
      label: Proposed definition
      description: Your own wording, or a short quote with the citation below.
    validations:
      required: true
  - type: dropdown
    id: wording_origin
    attributes:
      label: Is your definition quoted from the source or your own?
      description: SynAc records this so the entry carries the right license. Quoted wording stays under the source's license.
      options:
        - My own wording
        - Quoted verbatim from the source
        - Paraphrased from the source
    validations:
      required: true
  - type: input
    id: citation
    attributes:
      label: Supporting source (URL)
      placeholder: https://...
    validations:
      required: true
  - type: input
    id: license_url
    attributes:
      label: License or terms URL of that source
      description: Link to the license or terms that govern reuse and attribution.
      placeholder: https://...
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Disambiguation, related terms, or why this belongs in the glossary.
