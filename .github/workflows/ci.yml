name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/synac_test?schema=public
  SYNAC_STAGING_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/synac_staging_test?schema=public
  SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/synac_shadow?schema=public
  NEXT_PUBLIC_SITE_URL: http://localhost:3000

jobs:
  gate:
    name: Gate (format, lint, typecheck, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.27.0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # `synac_shadow` must stay EMPTY: `db:migrate:drift` resets it.
      - name: Create databases
        env:
          PGPASSWORD: postgres
        run: |
          for db in synac_test synac_staging_test synac_shadow; do
            psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
              -c "CREATE DATABASE $db;"
          done

      - name: Apply migrations
        run: |
          pnpm --filter @synac/db db:migrate:deploy
          DATABASE_URL="$SYNAC_STAGING_DATABASE_URL" pnpm --filter @synac/db db:migrate:deploy

      - name: Validate Prisma schema
        run: pnpm --filter @synac/db exec prisma validate

      # Exits 2 when schema.prisma and the migration history disagree.
      - name: Migration drift check
        run: pnpm --filter @synac/db db:migrate:drift

      - name: Version consistency
        run: pnpm version:check

      # Equivalent to `pnpm gate`; split for clearer logs.
      - name: Format check
        run: pnpm format

      - name: Lint
        run: pnpm lint

      # Advisory until the type-aware backlog in apps/worker is cleared;
      # flip `continue-on-error` off once `pnpm lint:strict` is green.
      - name: Lint (strict, no warnings)
        continue-on-error: true
        run: pnpm lint:strict

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.27.0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Create databases
        env:
          PGPASSWORD: postgres
        run: |
          for db in synac_test synac_staging_test; do
            psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
              -c "CREATE DATABASE $db;"
          done

      - name: Apply migrations
        run: |
          pnpm --filter @synac/db db:migrate:deploy
          DATABASE_URL="$SYNAC_STAGING_DATABASE_URL" pnpm --filter @synac/db db:migrate:deploy

      # Requires @vitest/coverage-v8 and vitest to be the same minor.
      # As of this change the root pins 4.1.11 while the workspaces pin
      # vitest 4.0.18, which fails at load time
      # ("'vitest/node' does not provide an export named 'BaseCoverageProvider'").
      # Align them in the lockfile before relying on this job.
      - name: Test with coverage
        run: pnpm test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage
          path: |
            apps/web/coverage/
            apps/worker/coverage/
            packages/db/coverage/
            packages/shared/coverage/
          if-no-files-found: warn
          retention-days: 14
