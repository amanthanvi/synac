packages:
  - apps/*
  - packages/*
  - tools/*

onlyBuiltDependencies:
  - esbuild
  - sharp
  - unrs-resolver

overrides:
  '@humanfs/node@<0.16.8': '^0.16.8'
  'brace-expansion@<1.1.21': '^1.1.21'
  'brace-expansion@>=2.0.0 <2.1.7': '^2.1.7'
  'brace-expansion@>=5.0.0 <5.0.12': '^5.0.12'
  'js-yaml@>=4.0.0 <4.3.2': '^4.3.2'
  'nanoid@>=3.0.0 <3.3.18': '^3.3.18'
  'postcss@<8.5.18': '^8.5.23'
  'source-map-js@>=1.0.0 <1.2.2': '^1.2.2'
  'vite': '7.3.6'
  'ws@<8.21.0': '^8.21.0'
  'sharp@<0.35.5': '^0.35.5'
  'esbuild@<0.28.1': '^0.28.1'

auditConfig:
  ignoreGhsas:
    # braces <=3.0.3 stack-exhaustion DoS. No patched release exists (3.0.3 is
    # the latest), and the only path is dev-only lint tooling:
    # eslint-config-next > @next/eslint-plugin-next > fast-glob > micromatch > braces.
    # Drop this entry once a fixed braces ships or that chain stops using it.
    - GHSA-vfj7-8cjw-p6xm
